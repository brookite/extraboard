name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            # A tag whose manifest disagrees with it produces a release Obsidian
            # will refuse to install, and the mistake is only visible after the
            # upload. Cheaper to fail here.
            - name: Check the tag matches manifest.json
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  version="$(node -p "require('./manifest.json').version")"
                  if [ "${tag#v}" != "$version" ]; then
                    echo "Tag $tag does not match manifest version $version" >&2
                    exit 1
                  fi

            - name: Build plugin
              run: |
                  npm ci
                  npm run build
                  npm test

            # The build writes the assembled plugin into dist/ (esbuild.config.mjs),
            # never to the repository root — main.js and the copied manifest are
            # gitignored there. Every path below is therefore dist/-relative; the
            # release assets must be exactly the three files a vault's plugin
            # folder holds.
            - name: Check for optional styles
              id: styles
              run: |
                  [ -f dist/styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      dist/main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'dist/styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    dist/main.js dist/manifest.json ${{ steps.styles.outputs.exists == 'true' && 'dist/styles.css' || '' }}
